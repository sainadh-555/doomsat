[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doomsat"
version = "0.1.0"
description = "Engineering-level 1U CubeSat Digital Twin and Mission Simulation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sainadh Garlapati", email = "snadh843@gmail.com" }
]
keywords = [
    "aerospace", "cubesat", "digital-twin", "simulation", "adcs",
    "sgp4", "lora", "cstp", "astrodynamics", "telemetry"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "pyserial>=3.5",
    "Pillow>=10.0.0",
    "sgp4>=2.23",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "plotly>=5.20.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]
sim = [
    "sgp4>=2.23",
    "astropy>=6.0.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "websockets>=12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
