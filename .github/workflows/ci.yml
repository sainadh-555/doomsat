name: GARUDA-1U CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Subsystem Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11" ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Execute Full Test Suite (108 Tests)
      run: |
        pytest -v --durations=10

    - name: Verify CLI Simulation
      run: |
        python -m doomsat.sim.cli sim --duration 10 --dt 1.0

    - name: Verify Wheel Package Build
      run: |
        pip install build
        python -m build
